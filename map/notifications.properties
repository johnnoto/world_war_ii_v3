# Texts for the notifications fired by triggers in the World War II v3 1939 scenario.

VICHY_FRANCE=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b>.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes to join the Royal Navy at Scapa Flow (sea zone 3).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
BALKAN_ACCESSION=<html><b>Romania and Bulgaria join the Axis</b><br><br>Romania and Bulgaria have signed the Tripartite Pact.<br>Their territory, the Ploesti oilfields and their armies are now at Germany's disposal.</html>
GOVERNMENTS_IN_EXILE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun. Its government fights on from London,<br>and the Belgian Congo now stands with the British Empire.</html>
ITALY_JOINS_WAR=<html><b>Italy enters the war</b><br><br>Mussolini has declared war on Britain, and on France if she is still fighting,<br>and Italy is now allied with Germany. The Mediterranean is a battlefield.</html>
FINLAND_JOINS=<html><b>Finland joins Germany</b><br><br>Finland has entered the war at Germany's side to win back what it lost to the Soviet Union.<br>Finland and its army are now under German control, on Leningrad's doorstep.</html>
GERMANY_REINFORCED=<html><b>The offensive in the West has failed</b><br><br>France has held Paris and is still producing arms. Germany calls up fresh divisions:<br><b>5 infantry</b> have been placed in Germany.</html>
DUTCH_EAST_INDIES=<html><b>The Dutch East Indies join the Allies</b><br><br>With Japan at war with the British Empire, the Dutch East Indies have declared war on Japan.<br>Borneo and the East Indies, with 1 infantry each, are now under British control.</html>
FRENCH_FACTORY_DESTROYED=<html><b>French industry wrecked</b><br><br>Paris has passed to German control for the first time. The French factory is destroyed<br>and removed from the game.</html>
BRITAIN_FALLS=<html><b>Britain has fallen</b><br><br>The Axis have taken the United Kingdom. Neither Washington nor Moscow can stand aside any longer:<br><br>&bull; The <b>United States</b> declares war on Germany.<br>&bull; The <b>Soviet Union</b> declares war on Germany.<br><br>They join France and the British Empire in the fight.</html>
GOVERNMENTS_IN_EXILE_FRANCE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun, and with London fallen its government has gone to Paris.<br>The Belgian Congo now stands with <b>France</b>.</html>
GOVERNMENT_TO_OTTAWA=<html><b>The Empire fights on</b><br><br>London has fallen. The King and the Royal Family have crossed the Atlantic, and Parliament now sits in Ottawa.<br><br>&bull; <b>Eastern Canada</b> is now a British capital, with a factory.<br>&bull; Britain keeps collecting income and building units, and fights on from Canada with the rest of the Empire.<br>&bull; The PUs Britain had in hand when London fell go to its captor.<br><br>"We shall go on to the end... until, in God's good time, the New World, with all its power and might, steps forth to the rescue and the liberation of the old."</html>
VICHY_FRANCE_OTTAWA=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b> and its government in Ottawa.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes across the Atlantic to join the Royal Navy off Halifax (sea zone 9).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
INDOCHINA_CRISIS=<html><b>Crisis in Indo-China</b><br><br>Japan has moved against French Indo-China while France is still fighting Germany.<br><br>&bull; <b>Britain</b> may now declare war on Japan in its Politics phase.<br>&bull; Washington sees its Pacific interests threatened: the <b>United States</b> will enter the war a round early, at the end of its round-3 turn.<br>&bull; The US reinforces its Pacific outposts: 1 infantry and 1 AA gun each to <b>Hawaii</b> and the <b>Philippines</b>.</html>
USA_ENTERS_WAR=<html><b>The United States enters the war</b><br><br>The arsenal of democracy will no longer stand aside. The United States is now at war with <b>Germany</b>, <b>Italy</b> and <b>Japan</b>.</html>
SOVIETS_STRIKE_FIRST=<html><b>The Soviets strike first</b><br><br>Stalin will not wait for Hitler to choose the hour. The Molotov-Ribbentrop Pact is torn up:<br>the <b>Soviet Union</b> has declared war on <b>Germany</b>.</html>
INDIA_FALLS=<html><b>India has fallen</b><br><br>Japanese troops have taken India, the jewel of the British Empire.<br>Washington will not stand by while Japan dominates Asia: the <b>United States</b> has declared war on <b>Japan</b>.</html>
SOUTHERN_ADVANCE=<html><b>The southern advance</b><br><br>Japan now holds French Indo-China, Borneo and the oil of the East Indies.<br>Washington answers with more than an embargo: the <b>United States</b> has declared war on <b>Japan</b>.</html>
JAPAN_BRIEFING=<html><body style='width:560px'><b>IMPERIAL GENERAL HEADQUARTERS &ndash; TOKYO, SEPTEMBER 1939</b><br><br>Two years into the China Incident, our armies hold Manchukuo and the coast, but Chiang Kai-shek fights on, fed by the Hanoi&ndash;Kunming railway and the Burma Road. In Europe, Germany has invaded Poland and Britain and France have declared war. The Soviets bloodied us at Khalkhin Gol and now stand idle. America watches, and controls our oil. The choice of war is yours.<br><br><b>Where we stand</b><br>&bull; At war with <b>China</b>. At peace with France, Britain, the USA and the USSR.<br>&bull; <b>China's lifelines:</b> each Chinese turn, China gets 1 free artillery in Yunnan while France holds Indo-China (the railway), and 1 more while Britain holds Burma (the Burma Road), as long as China holds Yunnan. Cut them.<br><br><b>Our options in the Politics phase</b><br>&bull; <b>Round 1+: Occupy Indochina</b> (war with France).<br>&bull; <b>Round 2+:</b> war with <b>Britain</b>, with the <b>USA</b>, with both (<b>Strike South</b>), or with the USSR (<b>Strike North</b>). If London falls, we may declare on Britain at once, even in round 1.<br><br><b>How the enemy will answer</b><br>&bull; <b>Crisis in Indo-China:</b> if we attack France while she still fights Germany, Britain may declare war on us, America enters the war a round early (end of its round-3 turn), and America sends 1 infantry and 1 AA gun each to Hawaii and the Philippines.<br>&bull; <b>War with Britain:</b> the Dutch East Indies (Borneo, East Indies) join Britain with 1 infantry each, and we may strike them that same turn. If <i>we</i> declare war on Britain, America may declare war on us at once.<br>&bull; <b>America declares war on us immediately</b> if we take <b>India</b>, or if we hold <b>Borneo, the East Indies and French Indo-China</b> together.<br>&bull; Otherwise America enters the war against all of the Axis at the end of its <b>round-4</b> turn. When we are at war with both Britain and America, Germany and Italy declare war on America.<br>&bull; The <b>USSR</b> may declare war on us (August Storm) from <b>round 4</b>, or once Germany has fallen.<br><br><b>National objectives</b> (+5 PUs each, every turn)<br>&bull; Axis hold Manchuria, Kiangsu and French Indo-China.<br>&bull; Southern Resource Area: Axis hold 4 of Kwangtung, East Indies, Borneo, Philippines, New Guinea, Solomon Islands.<br>&bull; Outer perimeter: Axis hold 1 of Hawaii, Australia, India.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
GERMANY_BRIEFING=<html><body style='width:560px'><b>OBERKOMMANDO DER WEHRMACHT &ndash; BERLIN, 1 SEPTEMBER 1939</b><br><br>At 4:45 this morning the Wehrmacht crossed into Poland. Britain and France have answered with declarations of war, but their armies sit behind the Maginot Line. The pact with Moscow, signed on 23 August, guards our back and keeps Soviet grain and oil flowing. Mussolini, bound to us by the Pact of Steel, hesitates. Strike fast, before the enemy's economies wake up.<br><br><b>Where we stand</b><br>&bull; At war with <b>Britain</b> and <b>France</b>. At peace with the USSR, Italy, Japan and the USA.<br>&bull; <b>Poland</b> is neutral (5 infantry, 1 artillery). Like the Low Countries and Norway, it may be invaded at no cost.<br><br><b>The calendar</b><br>&bull; <b>Round 2:</b> Italy enters the war on our side, automatically.<br>&bull; <b>Round 3:</b> Romania and Bulgaria join us at the start of our combat move, with 2 infantry and 1 artillery. <b>Operation Barbarossa</b> becomes possible.<br>&bull; <b>Round 3, end of our turn:</b> Finland joins us with 3 infantry and 1 artillery, on Leningrad's doorstep.<br>&bull; <b>Round 5:</b> we may declare war on the USA. If we have not attacked the USSR by the end of its round-5 turn, <b>Stalin strikes first</b>.<br><br><b>France</b><br>&bull; The first time we take Paris, the French factory is destroyed.<br>&bull; Hold Paris until our next turn and France signs an <b>armistice</b>: Morocco-Algeria and its garrison become ours, the rest of the empire rallies to Britain, and France leaves the war for good.<br>&bull; If we attack France and fail, and France rebuilds in Paris, we are sent <b>5 infantry</b> in Germany (once).<br>&bull; Anything Italy captures in our sphere (France, the Low Countries, Poland, Norway, Bulgaria-Romania, Finland) is handed to us.<br><br><b>Britain</b><br>&bull; Take <b>London</b> and we seize Britain's treasury, but the King and Parliament move to <b>Ottawa</b> and fight on, and the <b>USA and USSR</b> declare war on us at once.<br>&bull; The USA enters the war automatically at the end of its <b>round-4</b> turn, sooner if Japan provokes it.<br><br><b>National objectives (+5 PUs each, every turn)</b><br>&bull; Soviet Trade Agreement: while we are at peace with the USSR. Four-Year Plan: we hold Germany and Czechoslovakia-Hungary.<br>&bull; Fortress Europe: the Axis hold France, the Low Countries, Germany, Poland, Czechoslovakia-Hungary and Bulgaria-Romania.<br>&bull; Lebensraum: the Axis hold 3 of the Baltic States, East Poland, Belorussia, Eastern Ukraine, Ukraine.<br>&bull; Leningrad or the Caucasus: the Axis hold Karelia or the Caucasus.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
SOVIET_BRIEFING=<html><body style='width:560px'><b>STAVKA &ndash; THE KREMLIN, MOSCOW, SEPTEMBER 1939</b><br><br>Comrade Stalin has bought time. The pact with Hitler, and its secret protocol, give us a free hand in eastern Poland and the Baltic. But the purges have gutted the Red Army's officer corps, and in the east Zhukov has only just beaten the Japanese at Khalkhin Gol. The capitalists may bleed each other white; we must be ready when the Germans turn east.<br><br><b>Where we stand</b><br>&bull; At peace with everyone. We cannot attack Germany or Japan until the calendar or events allow it.<br>&bull; <b>East Poland</b> and the <b>Baltic States</b> are neutral, with small armies, and may be taken at no cost. <b>Finland</b> stays closed to everyone until it joins Germany at the end of Germany's round-3 turn.<br>&bull; Our national objectives only pay once we are at war with Germany.<br><br><b>War with Germany</b><br>&bull; Germany may launch <b>Operation Barbarossa</b> from <b>round 3</b>. Italy follows it into the war against us.<br>&bull; If Germany has not attacked by the end of our <b>round-5</b> turn, we <b>strike first</b> and declare war automatically.<br>&bull; If the Axis take <b>London</b>, we declare war on Germany at once.<br>&bull; Once at war with Germany we ally automatically with every power fighting Germany: Britain, France while she fights on, and the USA once it is in the war.<br><br><b>Japan</b><br>&bull; Japan may attack us (<b>Strike North</b>) from round 2. Our Far East armies are there to deter it.<br>&bull; We may turn on Japan (<b>August Storm</b>) from <b>round 4</b>, or once Germany has fallen.<br><br><b>National objectives (only while at war with Germany)</b><br>&bull; +5 Great Patriotic War: we hold Archangel and no Allied units are on Soviet soil.<br>&bull; +10 the Allies hold 3 of Norway, Finland, Poland, Bulgaria-Romania, Czechoslovakia-Hungary, the Balkans.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
BRITISH_BRIEFING=<html><body style='width:560px'><b>WAR CABINET &ndash; 10 DOWNING STREET, LONDON, 3 SEPTEMBER 1939</b><br><br>At 11:15 this morning Mr Chamberlain told the nation that we are at war with Germany. Poland cannot be saved by arms in time; the BEF is crossing to France and the Royal Navy must keep the sea lanes open. Rome is neutral for now, Tokyo watches our Asian possessions, and Washington will help only so far. The Empire must hold.<br><br><b>Where we stand</b><br>&bull; At war with <b>Germany</b>, allied with <b>France</b>. One infantry division of the BEF is already in France.<br>&bull; Neutrals like <b>Iceland</b> and <b>Persia</b> may be occupied at no cost, as we did in 1940 and 1941.<br><br><b>The calendar</b><br>&bull; <b>Round 2:</b> Italy declares war on us. Our Mediterranean fleet at Alexandria faces the Regia Marina.<br>&bull; <b>Round 2:</b> Japan may declare war on us. If London has fallen, it may do so at once.<br>&bull; <b>End of the US round-4 turn:</b> the USA enters the war, sooner if Japan provokes it.<br><br><b>If France falls</b><br>&bull; French West Africa, French Equatorial Africa and Madagascar rally to us with their garrisons, and one French cruiser joins the Royal Navy.<br>&bull; When the Low Countries fall, the <b>Belgian Congo</b> joins us.<br><br><b>If London falls</b><br>&bull; Our treasury is lost, but the King and Parliament move to <b>Ottawa</b>: Eastern Canada becomes our capital with a factory, and the USA and USSR declare war on Germany at once.<br><br><b>Asia</b><br>&bull; If Japan attacks <b>French Indo-China</b> while France still fights, we may declare war on Japan.<br>&bull; When Japan goes to war with us, the <b>Dutch East Indies</b> join us with 1 infantry each.<br>&bull; Hold <b>Burma</b> and China receives an extra artillery every turn over the Burma Road. If Japan takes <b>India</b>, America declares war on Japan.<br><br><b>National objectives (+5 PUs each, every turn)</b><br>&bull; The Empire holds: the Allies hold Eastern and Western Canada, Gibraltar, Egypt, Australia and South Africa.<br>&bull; A foothold in Europe: we, the USA or the USSR hold France (once it is no longer French) or the Balkans.<br>&bull; Carry the war to Japan: the Allies hold any of the Caroline Islands, Formosa, Iwo Jima, Japan or Okinawa.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
FRENCH_BRIEFING=<html><body style='width:560px'><b>GRAND QUARTIER G&Eacute;N&Eacute;RAL &ndash; VINCENNES, SEPTEMBER 1939</b><br><br>France is at war again. Our army is the largest in the West and the Maginot Line guards the frontier, but the Ardennes are thinly held and our tanks are scattered among the infantry. Britain is sending her expeditionary force. Behind us stands an empire across Africa and Asia. Hold Paris, and France endures.<br><br><b>Where we stand</b><br>&bull; At war with <b>Germany</b>, allied with <b>Britain</b>. The Low Countries are neutral, a road into France for whoever dares.<br><br><b>The battle for France</b><br>&bull; The first time Germany takes Paris, our factory is destroyed.<br>&bull; If Germany still holds Paris when its next turn begins, France signs an <b>armistice</b> and leaves the war for good: Morocco-Algeria goes to Germany, the rest of the empire rallies to Britain, the fleet is lost and Indo-China is left defenceless.<br>&bull; Retake Paris within that round and the armistice never happens.<br>&bull; If Germany attacks and we hold Paris <i>and</i> build new units there, Germany receives 5 infantry. Holding alone is not enough to provoke it.<br><br><b>Enemies on every side</b><br>&bull; <b>Round 2:</b> Italy enters the war against us.<br>&bull; Japan may occupy <b>Indo-China</b> from round 1. If it attacks while we still fight, Britain may declare war on Japan, the USA enters the war a round early and reinforces Hawaii and the Philippines.<br>&bull; While we hold Indo-China, China receives an artillery every turn over the Hanoi&ndash;Kunming railway.<br>&bull; If London falls while we still hold Paris, the <b>Belgian Congo</b> joins us when the Low Countries are overrun.<br><br><b>National objective</b><br>&bull; +3 PUs every turn: we hold Morocco-Algeria, French West Africa, French Equatorial Africa, Madagascar and Indo-China.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
ITALIAN_BRIEFING=<html><body style='width:560px'><b>COMANDO SUPREMO &ndash; PALAZZO VENEZIA, ROME, SEPTEMBER 1939</b><br><br>The Duce has declared Italy a non-belligerent. The army is not ready, and in the Pact of Steel talks we told Berlin we could not fight before 1942. But if France collapses, the Mediterranean, Mare Nostrum, could be ours: Egypt and Suez, Malta, Tunisia. We have one turn to prepare.<br><br><b>Where we stand</b><br>&bull; At peace with everyone in <b>round 1</b>.<br>&bull; <b>Round 2:</b> we enter the war automatically against Britain, and France if she is still fighting, and ally with Germany.<br>&bull; Our fleet at Taranto faces the British Mediterranean Fleet at Alexandria: a carrier, a cruiser and a destroyer, with no battleship.<br><br><b>Our ally</b><br>&bull; Territory in the German sphere that we capture (France, the Low Countries, Poland, Norway, Bulgaria-Romania, Finland) is handed to Germany. Our units there stay ours.<br>&bull; When Germany goes to war with the USSR or the USA, we follow.<br><br><b>National objectives (+5 PUs each, every turn)</b><br>&bull; The Axis hold 3 of Egypt, Trans-Jordan, France and Gibraltar.<br>&bull; Mare Nostrum: the Axis hold Italy, the Balkans, Morocco-Algeria and Libya, with no enemy surface warships in sea zones 13, 14 and 15.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
CHINESE_BRIEFING=<html><body style='width:560px'><b>NATIONAL MILITARY COUNCIL &ndash; CHUNGKING, SEPTEMBER 1939</b><br><br>Two years since the Marco Polo Bridge. Peking, Shanghai, Nanking and Canton have fallen, and the Generalissimo has moved the government up the Yangtze to Chungking. We have traded space for time and Japan is bogged down. Our lifelines to the world run south: the railway from Hanoi and the new Burma Road to Kunming. Hold on until the world joins the war.<br><br><b>How China fights</b><br>&bull; At war with <b>Japan</b>. We have no factory and no PUs: every turn we receive <b>1 infantry for every 2 territories</b> we hold, placed in China (at most 3 per territory).<br>&bull; Chinese units may not leave China.<br><br><b>Our lifelines</b><br>&bull; <b>Hanoi&ndash;Kunming railway:</b> 1 free artillery in Yunnan every turn while France holds French Indo-China.<br>&bull; <b>Burma Road:</b> 1 more while Britain holds Burma.<br>&bull; Both need <b>Yunnan</b> in our hands. Lose it and the aid stops.<br><br><b>Allies</b><br>&bull; Every power that goes to war with Japan becomes our ally: Britain, France, the USA, and the USSR if it attacks Japan.<br>&bull; The USA enters the war at the end of its <b>round-4</b> turn, sooner if Japan attacks Indo-China, takes India, or seizes the Dutch East Indies and Indo-China together.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
AMERICAN_BRIEFING=<html><body style='width:560px'><b>THE WHITE HOUSE &ndash; WASHINGTON, SEPTEMBER 1939</b><br><br>War has come to Europe and the President has proclaimed America's neutrality. The Neutrality Acts tie our hands, and Congress and the country want no part of another European war. But Cash and Carry, the destroyers-for-bases deal and Lend-Lease will make us the arsenal of democracy, and in the Pacific our oil keeps Japan's war machine running. We will be drawn in. The question is when.<br><br><b>Where we stand</b><br>&bull; At peace with everyone. <b>Neutrality Acts:</b> our income is cut by 15 PUs while we are at peace with all the Axis powers.<br>&bull; Our fleet is at sea and our army is small. Build now, for the war that is coming.<br><br><b>When we go to war</b><br>&bull; <b>End of our round-4 turn:</b> we enter the war automatically against Germany, Italy and Japan.<br>&bull; <b>Crisis in Indo-China:</b> if Japan attacks Indo-China while France still fights, we enter a round early, and 1 infantry and 1 AA gun each are sent to Hawaii and the Philippines.<br>&bull; We declare war on Japan at once if it takes <b>India</b>, or holds <b>Borneo, the East Indies and Indo-China</b> together. We may declare war on Japan once Japan attacks Britain.<br>&bull; If the Axis take <b>London</b>, we declare war on Germany at once.<br>&bull; Germany and Italy declare war on us once Japan is at war with both Britain and us.<br><br><b>National objectives (+5 PUs each, every turn, only while at war)</b><br>&bull; The Allies hold France. The Allies hold the Philippines. The Allies hold all three US mainland territories.<br>&bull; The Allies hold 3 of Midway, Wake, Hawaii and the Solomon Islands.<br><br><i>The full rules are in the game notes and the Objectives tab.</i></body></html>
