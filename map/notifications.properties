# Texts for the notifications fired by triggers in the World War II v3 1939 scenario.

VICHY_FRANCE=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Paris has fallen. France has signed an armistice with Germany and Italy.<br>Marshal P&eacute;tain's government at Vichy is now neutral, its empire and fleet out of the war,<br>and France collects no income while the Axis hold Paris.<br><br>Britain may strike at Vichy (Operation Catapult); Germany may occupy it (Case Anton).<br>If the Allies retake Paris, France returns to the war.</html>
FREE_FRANCE=<html><b>The Liberation of Paris</b><br><br>Allied armies have entered Paris. The French government is restored<br>and France is back in the war on the Allied side.</html>
BALKAN_ACCESSION=<html><b>Romania and Bulgaria join the Axis</b><br><br>Romania and Bulgaria have signed the Tripartite Pact.<br>Their territory, the Ploesti oilfields and their armies are now at Germany's disposal.</html>
GOVERNMENTS_IN_EXILE=<html><b>Governments in exile</b><br><br>The Netherlands and Belgium have been overrun. Their governments fight on from London,<br>and the Dutch East Indies and the Belgian Congo now stand with the British Empire.</html>
