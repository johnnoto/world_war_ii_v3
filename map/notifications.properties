# Texts for the notifications fired by triggers in the World War II v3 1939 scenario.

VICHY_FRANCE=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b>.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French fleet is disbanded, except one ship, chosen at random, which escapes to join the Royal Navy at Scapa Flow (sea zone 3).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
BALKAN_ACCESSION=<html><b>Romania and Bulgaria join the Axis</b><br><br>Romania and Bulgaria have signed the Tripartite Pact.<br>Their territory, the Ploesti oilfields and their armies are now at Germany's disposal.</html>
GOVERNMENTS_IN_EXILE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun. Its government fights on from London,<br>and the Belgian Congo now stands with the British Empire.</html>
ITALY_JOINS_WAR=<html><b>Italy enters the war</b><br><br>Mussolini has declared war on Britain, and on France if she is still fighting,<br>and Italy is now allied with Germany. The Mediterranean is a battlefield.</html>
FINLAND_JOINS=<html><b>Finland joins Germany</b><br><br>Finland has entered the war at Germany's side to win back what it lost to the Soviet Union.<br>Finland and its army are now under German control, on Leningrad's doorstep.</html>
GERMANY_REINFORCED=<html><b>The offensive in the West has failed</b><br><br>France has held Paris and is still producing arms. Germany calls up fresh divisions:<br><b>5 infantry</b> have been placed in Germany.</html>
DUTCH_EAST_INDIES=<html><b>The Dutch East Indies join the Allies</b><br><br>With Japan at war with the British Empire, the Dutch East Indies have declared war on Japan.<br>Borneo and the East Indies, with 1 infantry each, are now under British control.</html>
