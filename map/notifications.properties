# Texts for the notifications fired by triggers in the World War II v3 1939 scenario.

VICHY_FRANCE=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b>.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes to join the Royal Navy at Scapa Flow (sea zone 3).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
BALKAN_ACCESSION=<html><b>Romania and Bulgaria join the Axis</b><br><br>Romania and Bulgaria have signed the Tripartite Pact.<br>Their territory, the Ploesti oilfields and their armies are now at Germany's disposal.</html>
GOVERNMENTS_IN_EXILE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun. Its government fights on from London,<br>and the Belgian Congo now stands with the British Empire.</html>
ITALY_JOINS_WAR=<html><b>Italy enters the war</b><br><br>Mussolini has declared war on Britain, and on France if she is still fighting,<br>and Italy is now allied with Germany. The Mediterranean is a battlefield.</html>
FINLAND_JOINS=<html><b>Finland joins Germany</b><br><br>Finland has entered the war at Germany's side to win back what it lost to the Soviet Union.<br>Finland and its army are now under German control, on Leningrad's doorstep.</html>
GERMANY_REINFORCED=<html><b>The offensive in the West has failed</b><br><br>France has held Paris and is still producing arms. Germany calls up fresh divisions:<br><b>5 infantry</b> have been placed in Germany.</html>
DUTCH_EAST_INDIES=<html><b>The Dutch East Indies join the Allies</b><br><br>With Japan at war with the British Empire, the Dutch East Indies have declared war on Japan.<br>Borneo and the East Indies, with 1 infantry each, are now under British control.</html>
FRENCH_FACTORY_DESTROYED=<html><b>French industry wrecked</b><br><br>Paris has passed to German control for the first time. The French factory is destroyed<br>and removed from the game.</html>
BRITAIN_FALLS=<html><b>Britain has fallen</b><br><br>The Axis have taken the United Kingdom. Neither Washington nor Moscow can stand aside any longer:<br><br>&bull; The <b>United States</b> declares war on Germany.<br>&bull; The <b>Soviet Union</b> declares war on Germany.<br><br>They join France and the British Empire in the fight.</html>
GOVERNMENTS_IN_EXILE_FRANCE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun, and with London fallen its government has gone to Paris.<br>The Belgian Congo now stands with <b>France</b>.</html>
GOVERNMENT_TO_OTTAWA=<html><b>The Empire fights on</b><br><br>London has fallen. The King and the Royal Family have crossed the Atlantic, and Parliament now sits in Ottawa.<br><br>&bull; <b>Eastern Canada</b> is now a British capital, with a factory.<br>&bull; Britain keeps collecting income and building units, and fights on from Canada with the rest of the Empire.<br>&bull; The PUs Britain had in hand when London fell go to its captor.<br><br>"We shall go on to the end... until, in God's good time, the New World, with all its power and might, steps forth to the rescue and the liberation of the old."</html>
VICHY_FRANCE_OTTAWA=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b> and its government in Ottawa.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes across the Atlantic to join the Royal Navy off Halifax (sea zone 9).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
INDOCHINA_CRISIS=<html><b>Crisis in Indo-China</b><br><br>Japan has moved against French Indo-China while France is still fighting Germany.<br><br>&bull; <b>Britain</b> may now declare war on Japan in its Politics phase.<br>&bull; Washington sees its Pacific interests threatened: the <b>United States</b> will enter the war a round early, at the end of its round-3 turn.<br>&bull; The US reinforces its Pacific outposts: 1 infantry and 1 AA gun each to <b>Hawaii</b> and the <b>Philippines</b>.</html>
USA_ENTERS_WAR=<html><b>The United States enters the war</b><br><br>The arsenal of democracy will no longer stand aside. The United States is now at war with <b>Germany</b>, <b>Italy</b> and <b>Japan</b>.</html>
SOVIETS_STRIKE_FIRST=<html><b>The Soviets strike first</b><br><br>Stalin will not wait for Hitler to choose the hour. The Molotov-Ribbentrop Pact is torn up:<br>the <b>Soviet Union</b> has declared war on <b>Germany</b>.</html>
