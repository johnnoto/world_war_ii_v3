# Texts for the notifications fired by triggers in the World War II v3 1939 scenario.

VICHY_FRANCE=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b>.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes to join the Royal Navy at Scapa Flow (sea zone 3).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
BALKAN_ACCESSION=<html><b>Romania and Bulgaria join the Axis</b><br><br>Romania and Bulgaria have signed the Tripartite Pact.<br>Their territory, the Ploesti oilfields and their armies are now at Germany's disposal.</html>
GOVERNMENTS_IN_EXILE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun. Its government fights on from London,<br>and the Belgian Congo now stands with the British Empire.</html>
ITALY_JOINS_WAR=<html><b>Italy enters the war</b><br><br>Mussolini has declared war on Britain, and on France if she is still fighting,<br>and Italy is now allied with Germany. The Mediterranean is a battlefield.</html>
FINLAND_JOINS=<html><b>Finland joins Germany</b><br><br>Finland has entered the war at Germany's side to win back what it lost to the Soviet Union.<br>Finland and its army are now under German control, on Leningrad's doorstep.</html>
GERMANY_REINFORCED=<html><b>The offensive in the West has failed</b><br><br>France has held Paris and is still producing arms. Germany calls up fresh divisions:<br><b>5 infantry</b> have been placed in Germany.</html>
DUTCH_EAST_INDIES=<html><b>The Dutch East Indies join the Allies</b><br><br>With the British Empire and Japan at war, the Netherlands East Indies have declared war on Japan.<br>Borneo and the East Indies, with 1 infantry each, are now under British control.</html>
FRENCH_FACTORY_DESTROYED=<html><b>French industry wrecked</b><br><br>Paris has passed to German control for the first time. The French factory is destroyed<br>and removed from the game.</html>
BRITAIN_FALLS=<html><b>Britain has fallen</b><br><br>The Axis have taken the United Kingdom. Neither Washington nor Moscow can stand aside any longer:<br><br>&bull; The <b>United States</b> declares war on Germany.<br>&bull; The <b>Soviet Union</b> declares war on Germany.<br><br>They join France and the British Empire in the fight.</html>
GOVERNMENTS_IN_EXILE_FRANCE=<html><b>The Belgian government in exile</b><br><br>Belgium has been overrun, and with London fallen its government has gone to Paris.<br>The Belgian Congo now stands with <b>France</b>.</html>
GOVERNMENT_TO_OTTAWA=<html><b>The Empire fights on</b><br><br>London has fallen. The King and the Royal Family have crossed the Atlantic, and Parliament now sits in Ottawa.<br><br>&bull; <b>Eastern Canada</b> is now a British capital, with a factory.<br>&bull; Britain keeps collecting income and building units, and fights on from Canada with the rest of the Empire.<br>&bull; The PUs Britain had in hand when London fell go to its captor.<br><br>"We shall go on to the end... until, in God's good time, the New World, with all its power and might, steps forth to the rescue and the liberation of the old."</html>
VICHY_FRANCE_OTTAWA=<html><b>The Armistice of Compi&egrave;gne</b><br><br>Germany has held Paris for a full round. France has signed an armistice and leaves the war.<br><br>&bull; Morocco-Algeria and its garrison go over to <b>Germany</b>.<br>&bull; French West Africa, French Equatorial Africa and Madagascar, with their garrisons, rally to <b>Britain</b> and its government in Ottawa.<br>&bull; French Indo-China stays with Vichy but its garrison is disbanded. Japan may occupy it with no wider consequences.<br>&bull; The French navy is removed from the game. One French cruiser escapes across the Atlantic to join the Royal Navy off Halifax (sea zone 9).<br><br>France will not return: whoever takes Paris from now on keeps it.</html>
INDOCHINA_CRISIS=<html><b>Crisis in Indo-China</b><br><br>Japan has moved against French Indo-China while France is still fighting Germany.<br><br>&bull; <b>Britain</b> may now declare war on Japan in its Politics phase.<br>&bull; Washington sees its Pacific interests threatened: the <b>United States</b> will enter the war a round early, at the end of its round-3 turn.<br>&bull; The US reinforces its Pacific outposts: 1 infantry and 1 AA gun each to <b>Hawaii</b> and the <b>Philippines</b>.</html>
USA_ENTERS_WAR=<html><b>The United States enters the war</b><br><br>The arsenal of democracy will no longer stand aside. The United States is now at war with <b>Germany</b>, <b>Italy</b> and <b>Japan</b>.</html>
SOVIETS_STRIKE_FIRST=<html><b>The Soviets strike first</b><br><br>Stalin will not wait for Hitler to choose the hour. The Molotov-Ribbentrop Pact is torn up:<br>the <b>Soviet Union</b> has declared war on <b>Germany</b>.</html>
INDIA_FALLS=<html><b>India has fallen</b><br><br>Japanese troops have taken India, the jewel of the British Empire.<br>Washington will not stand by while Japan dominates Asia: the <b>United States</b> has declared war on <b>Japan</b>.</html>
SOUTHERN_ADVANCE=<html><b>The southern advance</b><br><br>Japan now holds French Indo-China, Borneo and the oil of the East Indies.<br>Washington answers with more than an embargo: the <b>United States</b> has declared war on <b>Japan</b>.</html>
# National anthems: sound only (no message), played at the start of each power's turn. See sounds.properties.
ANTHEM_GERMANS_sounds=anthem_Germans
ANTHEM_RUSSIANS_sounds=anthem_Russians
ANTHEM_JAPANESE_sounds=anthem_Japanese
ANTHEM_BRITISH_sounds=anthem_British
ANTHEM_FRENCH_sounds=anthem_French
ANTHEM_ITALIANS_sounds=anthem_Italians
ANTHEM_AMERICANS_sounds=anthem_Americans
ANTHEM_CHINESE_sounds=anthem_Chinese
GERMANY_BRIEFING=<html><body style='width:540px'><b>OBERKOMMANDO DER WEHRMACHT</b><br>To: The F&uuml;hrer and Supreme Commander of the Wehrmacht<br>Reich Chancellery, Berlin<br>September 1939<br><br><b>Situation report: the war in Poland and the West</b><br><br>Operations against Poland are proceeding to plan. Army Groups North and South are converging on Warsaw, and the Luftwaffe has won command of the air over Poland.<br><br>Britain and France declared war on 3 September. In the West, Army Group C holds the West Wall with second-line divisions; French forces have made only limited advances into the Saar. The Kriegsmarine has commerce raiders and U-boats at sea.<br><br>The non-aggression pact with the Soviet Union, signed on 23 August, secures our eastern flank and guarantees deliveries of grain and oil. Italy has declared itself non-belligerent and is not yet prepared to act.<br><br>The OKW recommends that Poland be finished quickly, so that every available division can be transferred to the West before the enemy has completed his mobilisation.<br><br><i>Oberkommando der Wehrmacht</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at war with Britain and France. Poland, the Low Countries and Norway are neutral and may be invaded.<br>&bull; <b>Round 2:</b> Italy enters the war on our side.<br>&bull; <b>Round 3:</b> Romania and Bulgaria join us. We may attack the USSR. Finland joins at the end of our turn.<br>&bull; <b>Round 4:</b> the USA enters the war at the end of its turn (sooner if provoked).<br>&bull; <b>Round 5:</b> if we have not attacked the USSR, it declares war on us at the end of its turn.<br>&bull; <b>France:</b> hold Paris until our next turn and France capitulates.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
SOVIET_BRIEFING=<html><body style='width:540px'><b>GENERAL STAFF OF THE WORKERS' AND PEASANTS' RED ARMY</b><br>To: The General Secretary of the Central Committee<br>The Kremlin, Moscow<br>September 1939<br><br><b>On the military situation in the West and in the Far East</b><br><br>The German army has invaded Poland and is advancing rapidly; the Polish state is collapsing. Britain and France have declared war on Germany but are giving Poland no effective help.<br><br>Under the treaty of 23 August and its secret protocol, eastern Poland, Latvia and Estonia fall within the Soviet sphere of interest. The Belorussian and Ukrainian fronts are being brought to readiness to cross the frontier and take these regions under the protection of the Red Army.<br><br>In the Far East, the 1st Army Group has encircled and destroyed the Japanese 23rd Infantry Division on the Khalkhin Gol, and the Japanese are seeking an armistice. Our Far Eastern forces must nonetheless remain at full strength.<br><br>The General Staff reports that the war between the capitalist powers gives the Soviet Union time, and recommends that this time be used to strengthen the army and the western frontier.<br><br><i>Chief of the General Staff of the Red Army</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at peace with all. East Poland and the Baltic States are neutral and may be taken. We may declare war on Japan on any turn.<br>&bull; <b>Round 3:</b> Germany may attack us. Italy follows it.<br>&bull; <b>Round 5:</b> if Germany has not attacked, we declare war on it at the end of our turn.<br>&bull; <b>If London falls,</b> we declare war on Germany at once.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
JAPAN_BRIEFING=<html><body style='width:540px'><b>IMPERIAL GENERAL HEADQUARTERS</b><br>To: Report to the Throne<br>The Imperial Palace, Tokyo<br>September 1939<br><br><b>On the situation in China, Manchukuo and Europe</b><br><br>The China Incident has entered its third year. Our armies hold Peking, Shanghai, Nanking, Hankow and Canton, but the Chungking regime fights on, supplied from abroad by the Burma Road and the railway from French Hanoi to Kunming.<br><br>On the Manchukuo&ndash;Mongolian frontier at Nomonhan, the Kwantung Army has suffered heavy losses against Soviet armour, and an armistice is being negotiated in Moscow. The German&ndash;Soviet pact of 23 August has overturned our policy towards the Soviet Union.<br><br>War has broken out in Europe. Britain and France must now look to their own defence, and their possessions in Asia are lightly held. The United States has given notice that it will end our commercial treaty, and we depend on it for oil and scrap iron.<br><br>Imperial General Headquarters respectfully submits that the settlement of the China Incident remains the first task, and that the opportunity in the south be studied with care.<br><br><i>Imperial General Headquarters</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at war with China. We may occupy French Indo-China.<br>&bull; <b>Round 2:</b> we may declare war on Britain, the USA or the USSR.<br>&bull; <b>Round 4:</b> the USA enters the war at the end of its turn. Sooner if we attack Indo-China while France fights, take India, or hold Borneo, the East Indies and Indo-China together.<br>&bull; <b>Any round:</b> the USSR may declare war on us.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
BRITISH_BRIEFING=<html><body style='width:540px'><b>CHIEFS OF STAFF COMMITTEE</b><br>To: The Prime Minister<br>10 Downing Street, London<br>September 1939<br><br><b>The strategic situation on the outbreak of war</b><br><br>Germany invaded Poland on 1 September, and His Majesty's Government's ultimatum expired at 11 a.m. on 3 September. Australia and New Zealand have declared war with us; South Africa and Canada are expected to follow.<br><br>We can give Poland no direct help. The British Expeditionary Force is crossing to France and will take its place beside the French army. The Home Fleet at Scapa Flow is enforcing the blockade of Germany, and the U-boat campaign has already begun with the sinking of the <i>Athenia</i>.<br><br>Italy has declared itself non-belligerent, but our Mediterranean Fleet must be ready should she enter the war. Japan remains a threat to our possessions in the Far East, which cannot be reinforced while the war in Europe lasts.<br><br>The Chiefs of Staff consider that we must prepare for a long war, in which the resources of the Empire, and in time of the United States, will prove decisive.<br><br><i>Chiefs of Staff Committee</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at war with Germany, allied with France.<br>&bull; <b>Round 2:</b> Italy enters the war against us. Japan may declare war on us.<br>&bull; <b>Round 4:</b> the USA enters the war at the end of its turn (sooner if provoked).<br>&bull; <b>If France falls,</b> most of the French empire rallies to us.<br>&bull; <b>If London falls,</b> the government moves to Ottawa and fights on.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
FRENCH_BRIEFING=<html><body style='width:540px'><b>GRAND QUARTIER G&Eacute;N&Eacute;RAL</b><br>To: The Pr&eacute;sident du Conseil, Minister of National Defence and War<br>Paris<br>September 1939<br><br><b>Situation of the armies at the opening of hostilities</b><br><br>General mobilisation began on 2 September and France has been at war with Germany since 5 p.m. on 3 September. Mobilisation is proceeding in good order.<br><br>In accordance with our undertakings to Poland, elements of the Third and Fourth Armies have advanced into the Saar against light resistance. The Maginot Line is fully manned. Belgian neutrality prevents us from moving forward to meet the enemy in the north.<br><br>The British Expeditionary Force is arriving and will take its place on our left. The Fleet holds the western Mediterranean and, with the Royal Navy, the Atlantic. The Empire is raising troops in North Africa, West Africa and Indo-China.<br><br>The High Command considers that the Polish army cannot hold for long, and that the main German effort will then turn west.<br><br><i>Grand Quartier G&eacute;n&eacute;ral</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at war with Germany, allied with Britain. Japan may move against Indo-China.<br>&bull; <b>Round 2:</b> Italy enters the war against us.<br>&bull; <b>If Germany takes Paris</b> and holds it until its next turn, France signs an armistice and leaves the war.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
ITALIAN_BRIEFING=<html><body style='width:540px'><b>STATO MAGGIORE GENERALE</b><br>To: The Duce, Head of Government<br>Palazzo Venezia, Rome<br>September 1939<br><br><b>On the state of the armed forces</b><br><br>On 1 September the Council of Ministers declared that Italy will take no military initiative. The armed forces are not ready for a major war: many divisions are below strength, artillery and motor transport are short, and stocks of raw materials would not last a long campaign.<br><br>The list of materials requested from Germany in August remains unfulfilled. The occupation of Albania in April has been completed, but Libya and Italian East Africa are isolated and could be cut off by the British fleets at Gibraltar and Alexandria.<br><br>The Regia Marina is strong in the central Mediterranean, but cannot by itself challenge the combined British and French fleets.<br><br>The General Staff recommends that the period of non-belligerence be used to complete the army's preparation.<br><br><i>Stato Maggiore Generale</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Round 1:</b> at peace with all.<br>&bull; <b>Round 2:</b> we enter the war against Britain (and France, if still fighting) and ally with Germany.<br>&bull; <b>Round 3:</b> when Germany attacks the USSR, we follow.<br>&bull; <b>Round 4:</b> the USA enters the war at the end of its turn (sooner if provoked).<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
CHINESE_BRIEFING=<html><body style='width:540px'><b>NATIONAL MILITARY AFFAIRS COMMISSION</b><br>To: The Chairman of the Military Affairs Commission<br>Chungking<br>September 1939<br><br><b>On the War of Resistance</b><br><br>The War of Resistance has entered its third year. The enemy holds the coast and the great cities, but his advance has slowed, and our armies are being reorganised in the interior. The enemy is massing in northern Hunan, and an attack on Changsha is expected.<br><br>Supplies reach us by the Burma Road to Kunming and by the railway from Haiphong and Hanoi. Both must be kept open at all costs. Soviet aircraft and volunteers continue to serve with our air force.<br><br>War has broken out in Europe. Britain and France may now be less able to resist Japanese pressure to close our supply routes, but the war may in time bring the Western powers into the struggle against Japan.<br><br>The Commission recommends that the war of attrition be continued, trading space for time.<br><br><i>National Military Affairs Commission</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Every round:</b> 1 infantry for every 2 territories we hold, plus 1 artillery in Yunnan for each open supply route (French Indo-China, British Burma) while we hold Yunnan.<br>&bull; <b>Round 4:</b> the USA enters the war at the end of its turn, sooner if Japan provokes it.<br>&bull; <b>Any round:</b> the USSR may declare war on Japan.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
AMERICAN_BRIEFING=<html><body style='width:540px'><b>JOINT ARMY AND NAVY BOARD</b><br>To: The President<br>The White House, Washington<br>September 1939<br><br><b>The military position of the United States</b><br><br>War has broken out in Europe, and the United States has proclaimed its neutrality. A limited national emergency has been declared, and the Navy has established a Neutrality Patrol in the western Atlantic.<br><br>The Regular Army numbers fewer than 200,000 men and is short of modern equipment. The United States Fleet is based on the West Coast, with a small force in Hawaii. Our position in the Philippines cannot be held against a determined attack.<br><br>In the Pacific, Japan continues its war in China, and the notice given in July to end the commercial treaty with Japan takes effect in January. In Europe, the Neutrality Acts forbid the sale of arms to Britain and France.<br><br>The Board recommends an immediate increase in the strength of the Army and the Navy, and that the defence of the Western Hemisphere be the first concern.<br><br><i>Joint Army and Navy Board</i><br><br><hr><b>What lies ahead</b><br>&bull; <b>Rounds 1&ndash;3:</b> neutral; our income is cut by 15 PUs while at peace.<br>&bull; <b>Round 4:</b> at the end of our turn we enter the war against Germany, Italy and Japan.<br>&bull; <b>Sooner if:</b> London falls, Japan attacks Indo-China while France fights, takes India, or holds Borneo, the East Indies and Indo-China.<br><br><i>Full rules: Help &gt; Game Notes, and the Objectives tab.</i></body></html>
