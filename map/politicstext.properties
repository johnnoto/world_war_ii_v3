# Texts for the political actions (declarations of war) in the World War II v3 1939 scenario.
# Each key is the "text" value of a politicalActionAttachment.

ITALY_ENTERS_WAR.BUTTON=Italy Enters the War
ITALY_ENTERS_WAR.DESCRIPTION=June 1940. Mussolini declares war on Britain, and on France if she is still fighting, to share in the spoils of victory.
ITALY_ENTERS_WAR.NOTIFICATION_SUCCESS=Italy is at war. The Mediterranean is now a battlefield.
ITALY_ENTERS_WAR.OTHER_NOTIFICATION_SUCCESS=Italy has declared war on the Allies.
ITALY_ENTERS_WAR.NOTIFICATION_FAILURE=Italy remains a non-belligerent.
ITALY_ENTERS_WAR.OTHER_NOTIFICATION_FAILURE=Italy remains a non-belligerent.

BARBAROSSA.BUTTON=Operation Barbarossa
BARBAROSSA.DESCRIPTION=Tear up the Molotov-Ribbentrop Pact and invade the Soviet Union. The Soviet trade agreement ends.
BARBAROSSA.NOTIFICATION_SUCCESS=Operation Barbarossa has begun. Germany is at war with the Soviet Union.
BARBAROSSA.OTHER_NOTIFICATION_SUCCESS=Germany has invaded the Soviet Union.
BARBAROSSA.NOTIFICATION_FAILURE=The invasion is postponed.
BARBAROSSA.OTHER_NOTIFICATION_FAILURE=Germany has not attacked the Soviet Union.

SOVIET_WAR_ON_GERMANY.BUTTON=War with Germany
SOVIET_WAR_ON_GERMANY.DESCRIPTION=Strike before Hitler does: declare war on Germany.
SOVIET_WAR_ON_GERMANY.NOTIFICATION_SUCCESS=The Soviet Union is at war with Germany.
SOVIET_WAR_ON_GERMANY.OTHER_NOTIFICATION_SUCCESS=The Soviet Union has declared war on Germany.
SOVIET_WAR_ON_GERMANY.NOTIFICATION_FAILURE=The Pact holds for now.
SOVIET_WAR_ON_GERMANY.OTHER_NOTIFICATION_FAILURE=The Pact holds for now.

STRIKE_SOUTH.BUTTON=Strike South (Pearl Harbor)
STRIKE_SOUTH.DESCRIPTION=December 1941. Attack the United States and the British Empire together to seize the resources of Southeast Asia.
STRIKE_SOUTH.NOTIFICATION_SUCCESS=A date which will live in infamy: Japan is at war with Britain and the United States.
STRIKE_SOUTH.OTHER_NOTIFICATION_SUCCESS=Japan has attacked Britain and the United States.
STRIKE_SOUTH.NOTIFICATION_FAILURE=Negotiations continue in Washington.
STRIKE_SOUTH.OTHER_NOTIFICATION_FAILURE=Japan has not struck.

STRIKE_SOUTH_BRITAIN.BUTTON=Strike South (British Empire)
STRIKE_SOUTH_BRITAIN.DESCRIPTION=Already at war with the United States: attack the British Empire in Asia.
STRIKE_SOUTH_BRITAIN.NOTIFICATION_SUCCESS=Japan is at war with the British Empire.
STRIKE_SOUTH_BRITAIN.OTHER_NOTIFICATION_SUCCESS=Japan has attacked the British Empire.
STRIKE_SOUTH_BRITAIN.NOTIFICATION_FAILURE=Japan holds back.
STRIKE_SOUTH_BRITAIN.OTHER_NOTIFICATION_FAILURE=Japan holds back.

OCCUPY_INDOCHINA.BUTTON=Occupy French Indo-China
OCCUPY_INDOCHINA.DESCRIPTION=September 1940. Move into French Indo-China to cut China's southern supply line.
OCCUPY_INDOCHINA.NOTIFICATION_SUCCESS=Japan is at war with France.
OCCUPY_INDOCHINA.OTHER_NOTIFICATION_SUCCESS=Japan has moved against French Indo-China.
OCCUPY_INDOCHINA.NOTIFICATION_FAILURE=Japan holds back.
OCCUPY_INDOCHINA.OTHER_NOTIFICATION_FAILURE=Japan holds back.

STRIKE_NORTH.BUTTON=Strike North
STRIKE_NORTH.DESCRIPTION=Avenge Khalkhin Gol: attack the Soviet Far East.
STRIKE_NORTH.NOTIFICATION_SUCCESS=Japan is at war with the Soviet Union.
STRIKE_NORTH.OTHER_NOTIFICATION_SUCCESS=Japan has attacked the Soviet Union.
STRIKE_NORTH.NOTIFICATION_FAILURE=Japan holds back.
STRIKE_NORTH.OTHER_NOTIFICATION_FAILURE=Japan holds back.

AUGUST_STORM.BUTTON=August Storm
AUGUST_STORM.DESCRIPTION=Germany is beaten or the war is in its last summer: turn the Red Army on Japan.
AUGUST_STORM.NOTIFICATION_SUCCESS=The Soviet Union is at war with Japan.
AUGUST_STORM.OTHER_NOTIFICATION_SUCCESS=The Soviet Union has declared war on Japan.
AUGUST_STORM.NOTIFICATION_FAILURE=The Neutrality Pact holds.
AUGUST_STORM.OTHER_NOTIFICATION_FAILURE=The Neutrality Pact holds.

GERMANY_WAR_USA.BUTTON=Declare War on the United States
GERMANY_WAR_USA.DESCRIPTION=End the undeclared war in the Atlantic and unleash the U-boats on American shipping.
GERMANY_WAR_USA.NOTIFICATION_SUCCESS=Germany is at war with the United States.
GERMANY_WAR_USA.OTHER_NOTIFICATION_SUCCESS=Germany has declared war on the United States.
GERMANY_WAR_USA.NOTIFICATION_FAILURE=Germany holds back.
GERMANY_WAR_USA.OTHER_NOTIFICATION_FAILURE=Germany holds back.

USA_WAR_GERMANY.BUTTON=War with Germany
USA_WAR_GERMANY.DESCRIPTION=Bring the arsenal of democracy into the war in Europe.
USA_WAR_GERMANY.NOTIFICATION_SUCCESS=The United States is at war with Germany.
USA_WAR_GERMANY.OTHER_NOTIFICATION_SUCCESS=The United States has declared war on Germany.
USA_WAR_GERMANY.NOTIFICATION_FAILURE=Congress is not yet ready.
USA_WAR_GERMANY.OTHER_NOTIFICATION_FAILURE=The United States stays neutral.

USA_WAR_JAPAN.BUTTON=War with Japan
USA_WAR_JAPAN.DESCRIPTION=Go to war with Japan in the Pacific.
USA_WAR_JAPAN.NOTIFICATION_SUCCESS=The United States is at war with Japan.
USA_WAR_JAPAN.OTHER_NOTIFICATION_SUCCESS=The United States has declared war on Japan.
USA_WAR_JAPAN.NOTIFICATION_FAILURE=Congress is not yet ready.
USA_WAR_JAPAN.OTHER_NOTIFICATION_FAILURE=The United States stays neutral.

USA_WAR_ITALY.BUTTON=War with Italy
USA_WAR_ITALY.DESCRIPTION=Declare war on Italy.
USA_WAR_ITALY.NOTIFICATION_SUCCESS=The United States is at war with Italy.
USA_WAR_ITALY.OTHER_NOTIFICATION_SUCCESS=The United States has declared war on Italy.
USA_WAR_ITALY.NOTIFICATION_FAILURE=Not yet.
USA_WAR_ITALY.OTHER_NOTIFICATION_FAILURE=Not yet.

BRITAIN_WAR_VICHY.BUTTON=Operation Catapult
BRITAIN_WAR_VICHY.DESCRIPTION=Strike at Vichy France before its fleet and empire fall into German hands.
BRITAIN_WAR_VICHY.NOTIFICATION_SUCCESS=Britain is at war with Vichy France.
BRITAIN_WAR_VICHY.OTHER_NOTIFICATION_SUCCESS=Britain has attacked Vichy France.
BRITAIN_WAR_VICHY.NOTIFICATION_FAILURE=Britain holds back.
BRITAIN_WAR_VICHY.OTHER_NOTIFICATION_FAILURE=Britain holds back.

CASE_ANTON.BUTTON=Case Anton
CASE_ANTON.DESCRIPTION=Occupy Vichy France and seize what remains of the French empire.
CASE_ANTON.NOTIFICATION_SUCCESS=Germany is at war with Vichy France.
CASE_ANTON.OTHER_NOTIFICATION_SUCCESS=Germany has moved against Vichy France.
CASE_ANTON.NOTIFICATION_FAILURE=Vichy is left alone for now.
CASE_ANTON.OTHER_NOTIFICATION_FAILURE=Vichy is left alone for now.

OPERATION_TORCH.BUTTON=Operation Torch
OPERATION_TORCH.DESCRIPTION=Land in Vichy French North Africa and open a second front against the Axis.
OPERATION_TORCH.NOTIFICATION_SUCCESS=The United States is at war with Vichy France.
OPERATION_TORCH.OTHER_NOTIFICATION_SUCCESS=American forces are moving against Vichy France.
OPERATION_TORCH.NOTIFICATION_FAILURE=The landings are postponed.
OPERATION_TORCH.OTHER_NOTIFICATION_FAILURE=The landings are postponed.
