# Sounds for the World War II v3 map.
Sound.Default.Folder=ww2
# Each power's anthem plays at the start of its turn, for every player, through the scenario's anthem triggers.
# (notification_anthem_<power> is the clip a notification with ANTHEM_<POWER>_sounds=anthem_<power> plays.)
notification_anthem_Germans=ww2/required_your_turn_series_Germans
notification_anthem_Russians=ww2/required_your_turn_series_Russians
notification_anthem_Japanese=ww2/required_your_turn_series_Japanese
notification_anthem_British=ww2/required_your_turn_series_British
notification_anthem_French=ww2/required_your_turn_series_French
notification_anthem_Italians=ww2/required_your_turn_series_Italians
notification_anthem_Americans=ww2/required_your_turn_series_Americans
notification_anthem_Chinese=ww2/required_your_turn_series_Chinese
# TripleA's own turn-start anthem only plays after a remote or AI turn; switch it off so anthems never play twice.
required_your_turn_series=NONE
required_your_turn_series_Germans=NONE
required_your_turn_series_Russians=NONE
required_your_turn_series_Japanese=NONE
required_your_turn_series_British=NONE
required_your_turn_series_French=NONE
required_your_turn_series_Italians=NONE
required_your_turn_series_Americans=NONE
required_your_turn_series_Chinese=NONE
